<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Page produit | Sportifano</title>
<style>body{margin:0;background:#f6f7f5;font-family:Arial,sans-serif;color:#171a18;min-height:100vh;display:grid;place-items:center}main{max-width:520px;padding:40px 24px;text-align:center}h1{font-size:30px}a{display:inline-block;background:#d6fa35;padding:16px 22px;border-radius:35px;text-decoration:none;color:#171a18;font-weight:800}</style>
</head>
<body>
<main>
<h1>SPORTIFANO</h1>
<p>Cette adresse ne correspond pas à une page disponible. Vous pouvez ouvrir la collection pour retrouver le produit.</p>
<a href="/#catalogue">Voir la collection</a>
</main>
<script>
(function(){
  const match=location.pathname.match(/^\/produits\/([^/]+)\/?$/);
  if(!match)return;
  try {
    const id=decodeURIComponent(match[1]);
    if(/^[A-Za-z0-9_-]{1,120}$/.test(id))location.replace('/?product='+encodeURIComponent(id));
  }catch{}
})();
</script>
</body>
</html>
