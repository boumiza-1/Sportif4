name: Publish SEO storefront

on:
  push:
    branches: [main, seo-static-pages]
  workflow_dispatch:
  # Refresh generated pages after catalog changes made through the Firebase admin.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test static generation
        run: node tests/seo-build.test.mjs
      - name: Generate pages from the public Firebase catalog
        run: node scripts/build-seo.mjs --out dist
      - name: Upload complete site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # configure-pages only discovers an existing site; it does not migrate
      # legacy branch publishing. Switch the source only after a complete build
      # succeeded, and omit cname/source so the existing domain is preserved.
      - name: Select workflow publishing for the existing Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const api = process.env.GITHUB_API_URL || 'https://api.github.com';
          const endpoint = `${api}/repos/${process.env.GITHUB_REPOSITORY}/pages`;
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          };
          const current = await fetch(endpoint, { headers });
          if (!current.ok) {
            throw new Error(`Cannot read the existing GitHub Pages settings (HTTP ${current.status}). No site settings were changed.`);
          }
          const site = await current.json();
          if (site.build_type !== 'workflow') {
            const response = await fetch(endpoint, {
              method: 'PUT',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({ build_type: 'workflow' })
            });
            if (!response.ok) {
              throw new Error(`GitHub refused the Pages source update (HTTP ${response.status}). The owner must select Settings > Pages > Source > GitHub Actions, then rerun this workflow. The existing domain was not edited.`);
            }
            console.log('Pages source changed to GitHub Actions; the custom domain was preserved.');
          } else {
            console.log('Pages already uses GitHub Actions.');
          }
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy generated storefront
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
