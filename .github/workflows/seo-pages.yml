name: Publish SEO storefront

on:
  push:
    branches: [main, seo-static-pages]
  workflow_dispatch:
  # Refresh generated pages after catalog changes made through the Firebase admin.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test static generation
        run: |
          node tests/seo-build.test.mjs
          node tests/seo-live-check.test.mjs
          node tests/seo-pages-wait.test.mjs
      - name: Generate pages from the public Firebase catalog
        run: node scripts/build-seo.mjs --out dist
      - name: Summarize generated public pages
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { productPath } from './seo-shared.mjs';
          const summary = JSON.parse(readFileSync('dist/seo-build.json', 'utf8'));
          const catalog = JSON.parse(readFileSync('dist/catalogue.json', 'utf8'));
          const lines = [
            '## Generated SEO pages',
            `Source commit: ${summary.sourceCommit}`,
            `Visible products: ${summary.products}`,
            `Populated collections: ${summary.indexableCategories}`,
            `Sitemap URLs: ${summary.sitemapUrls}`,
            ...catalog.products.slice(0, 3).map(p => summary.baseUrl + productPath(p.id))
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n\n') + '\n');
          NODE
      - name: Upload complete site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out deployment verification
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      # Branch-source Pages is supported by deploy-pages. Wait for GitHub's
      # automatic legacy deployment so it cannot overwrite the generated site.
      - name: Wait for the automatic branch deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-legacy-pages.mjs
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy generated storefront
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify the published SEO pages
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          node scripts/check-live-seo.mjs > /tmp/sportifano-live-seo.json
          cat /tmp/sportifano-live-seo.json
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('/tmp/sportifano-live-seo.json', 'utf8'));
          const lines = [
            '## Published site verification',
            `Status: ${result.status}`,
            `Canonical site: ${result.baseUrl}`,
            `Source commit: ${result.sourceCommit}`,
            `Published products: ${result.publishedProducts}`,
            `Checked product pages: ${result.checkedProducts}`,
            `Sitemap URLs: ${result.sitemapUrls}`,
            `Redirect warnings: ${result.redirectWarnings.length}`,
            ...result.redirectChecks.map(r => `${r.from} → ${r.finalUrl || r.error}: ${r.ok ? 'OK' : 'requires domain settings review'}`)
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n\n') + '\n');
          console.log(`::notice::SEO verified: ${result.publishedProducts} public products; ${result.checkedProducts} product pages checked; ${result.sitemapUrls} sitemap URLs; ${result.redirectWarnings.length} redirect warnings; commit ${result.sourceCommit}.`);
          for (const warning of result.redirectWarnings) console.log('::warning::' + `Domain redirect needs review: ${warning.from} -> ${warning.finalUrl || warning.error}`.replace(/[\r\n]/g, ' '));
          NODE
